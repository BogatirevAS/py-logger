[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logger"
dynamic = ["version"]
description = "Pydantic-based wrapper around stdlib logging with session scopes and class mixins"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
keywords = ["logging", "logger", "pydantic", "structured-logging", "session"]
authors = [
  { name = "Bogatyrev Aleksandr", email = "bogatirevas.dev@gmail.com" },
]
maintainers = [
  { name = "Bogatyrev Aleksandr", email = "bogatirevas.dev@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
]

[project.urls]
Documentation = "https://github.com/BogatiterAS/py-logger#readme"
Issues = "https://github.com/BogatiterAS/py-logger/issues"
Source = "https://github.com/BogatiterAS/py-logger"

[tool.hatch.version]
path = "src/logger/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/logger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-s"
testpaths = ["tests"]
